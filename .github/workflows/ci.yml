name: NestJS Core CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Code
      uses: actions/checkout@v4

    - name: Setup Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install Architecture Dependencies
      run: npm ci

    - name: Generate Prisma Types Artifacts
      run: npx prisma generate

    - name: Execute Strict Production Build
      run: npm run build
